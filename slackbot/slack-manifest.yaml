# Paste at https://api.slack.com/apps -> Create New App -> From a manifest.
# Then: Basic Information -> App-Level Tokens -> generate one with connections:write (SLACK_APP_TOKEN),
# Install to Workspace (SLACK_BOT_TOKEN). Invite the bot to the channels it should read: /invite @TicketBot
display_information:
  name: TicketBot
  description: Turns a Slack thread into a well-specified Trello card or Linear issue
  background_color: "#1f2937"
features:
  bot_user:
    display_name: TicketBot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - reactions:read
      - reactions:write
      - chat:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - reaction_added
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
