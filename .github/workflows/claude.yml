# Reusable: interactive @claude on issues and PRs.
# Caller must trigger on issue_comment/pull_request_review_comment [created], issues [opened, assigned], pull_request_review [submitted]
# and guard with the contains('@claude') condition (see examples/claude.yml).
name: Claude (reusable)

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-opus-5-5
      max_turns:
        type: number
        default: 50
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/ishwar-iyer12/agent-kit.git
          plugins: agent-kit@agent-kit
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
