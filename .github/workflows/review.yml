# Reusable: PR reviewer agent (claude-code-action, API credits).
# Caller:  jobs: review: { uses: ishwar-iyer12/agent-kit/.github/workflows/review.yml@main, secrets: inherit }
# Caller must trigger on pull_request [opened, synchronize, ready_for_review, reopened, labeled].
# Secrets: ANTHROPIC_API_KEY preferred; CLAUDE_CODE_OAUTH_TOKEN used when the API key is absent.
name: Review (reusable)

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-sonnet-5-5
      deep_model:
        type: string
        default: claude-opus-5-5
      max_turns:
        type: number
        default: 30
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/ishwar-iyer12/agent-kit.git
          plugins: |
            code-review@claude-code-plugins
            agent-kit@agent-kit
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Before reviewing, load the agent-kit review-checklist skill and apply every item. If the PR adds files under design/<id>/ (expected.png, actual.png, design.jsx, tokens.json), also check the implementation against that export and flag visible drift. Report only real defects; skip style nits."

  deep-review:
    if: github.event.action == 'labeled' && github.event.label.name == 'deep-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/ishwar-iyer12/agent-kit.git
          plugins: |
            code-review@claude-code-plugins
            agent-kit@agent-kit
          prompt: "/code-review:code-review high --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model ${{ inputs.deep_model }}
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Before reviewing, load the agent-kit review-checklist skill and apply every item. Deep review: trace data flow across files, check tests exercise the changed behaviour, and compare any design/<id>/ export against the implementation."
